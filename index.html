.leaflet-container .leaflet-marker-pane img,.leaflet-container .leaflet-tile-pane img,.leaflet-container img.leaflet-image-layer,.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:none;touch-action:pinch-zoom}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-tile{filter:inherit;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-box{width:0;height:0;box-sizing:border-box;z-index:800;border:2px dotted var(--navy);background:rgba(255,255,255,.4)}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right}
.leaflet-bottom .leaflet-control{margin-bottom:6px}.leaflet-right .leaflet-control{margin-right:6px}.leaflet-left .leaflet-control{margin-left:10px}
.leaflet-fade-anim .leaflet-popup{opacity:0;transition:opacity .2s linear}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup{opacity:1}
.leaflet-zoom-animated{transform-origin:0 0}
svg.leaflet-zoom-animated{will-change:transform}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}
.leaflet-grab{cursor:grab}
.leaflet-crosshair,.leaflet-crosshair .leaflet-interactive{cursor:crosshair}
.leaflet-dragging .leaflet-grab,.leaflet-dragging .leaflet-grab .leaflet-interactive{cursor:grabbing}
.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}
.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:10px}
.leaflet-popup-content{margin:12px 16px;line-height:1.4;min-height:1px;font-size:13px}
.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-top:-1px;margin-left:-20px;overflow:hidden;pointer-events:none}
.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;pointer-events:auto;transform:rotate(45deg)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.leaflet-container a.leaflet-popup-close-button{position:absolute;top:2px;right:4px;border:none;text-align:center;width:24px;height:24px;font:18px/24px var(--sans);color:var(--ink-faint);text-decoration:none;background:transparent}
.leaflet-tooltip{position:absolute;padding:0;white-space:nowrap;user-select:none;pointer-events:none}
.leaflet-control-scale-line{border:2px solid var(--ink-soft);border-top:none;line-height:1.1;padding:2px 5px 1px;white-space:nowrap;box-sizing:border-box;background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--ink);font:11px var(--mono)}
.leaflet-control-scale-line:not(:first-child){border-top:2px solid var(--ink-soft);border-bottom:none;margin-top:-2px}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 80%,transparent);margin:0;padding:1px 6px;font-size:10.5px;color:var(--ink-soft);border-radius:6px 0 0 0}
.leaflet-control-attribution a{color:var(--navy-2)}
.leaflet-control-attribution .credit{font-weight:600;color:var(--ink)}

/* ---------- Site banner (very top) ---------- */
.sitebar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:5px 16px;background:#0A2352;color:#E3E9F5;font-size:12px;line-height:1.3;position:relative;z-index:1201;border-bottom:1px solid rgba(192,168,105,.35)}
.sitebar .sb-seal{width:14px;height:14px;flex:0 0 auto}
.sitebar b{color:#fff;font-weight:600}
.sitebar .sb-tag{margin-left:2px;padding:1px 7px;border-radius:999px;background:rgba(192,168,105,.18);color:#C0A869;font-weight:600;font-size:11px;letter-spacing:.02em}
.sitebar .sb-secure{margin-left:auto;display:inline-flex;align-items:center;gap:5px;color:#C9D3E8;white-space:nowrap}
.sitebar .sb-secure svg{width:12px;height:12px}
@media (max-width: 720px){
  .sitebar{padding:4px 10px;padding-top:calc(4px + env(safe-area-inset-top,0px));font-size:11px;gap:6px}
  .sitebar .sb-secure span{display:none}
  .topbar{padding-top:6px!important}
}

/* ---------- App ---------- */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}

.topbar{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--navy);color:#fff;position:relative;z-index:1200}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.seal{flex:0 0 auto;width:34px;height:34px}
.brand-text{display:flex;flex-direction:column;line-height:1.1;text-align:left}
.brand-city{font:600 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.brand-name{font:700 17px var(--serif);white-space:nowrap}
.search{flex:1 1 auto;max-width:560px;margin-inline:auto;position:relative}
.search input{width:100%;height:40px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);color:#fff;padding:0 40px 0 40px;outline:none}
.search input::placeholder{color:rgba(255,255,255,.7)}
.search input:focus{background:#fff;color:#131C33;border-color:#fff}
.search input:focus::placeholder{color:#8490AA}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search .s-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;pointer-events:none;color:rgba(255,255,255,.8)}
.search input:focus~.s-ico{color:#56627E}
.search .s-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:inherit;cursor:pointer;display:grid;place-items:center}
.search input:focus~.s-clear{color:#56627E}
.results{position:absolute;top:46px;left:0;right:0;background:var(--surface);color:var(--ink);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--line);max-height:min(60vh,420px);overflow:auto;padding:6px}
.results .r{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer}
.results .r[aria-selected="true"],.results .r:hover{background:var(--surface-2)}
.r-main{flex:1;min-width:0}
.r-t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-s{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kchip{flex:0 0 auto;font:600 10px var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line)}
.results .empty{padding:14px;color:var(--ink-soft);font-size:13px}
.top-actions{display:flex;gap:8px;flex:0 0 auto}
.tbtn{height:36px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.1)}
.tbtn.gold{background:var(--gold);color:#212C46;border-color:var(--gold)}
.tbtn svg{width:16px;height:16px}

.stage{flex:1 1 auto;position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--map-bg)}
#map.no-tiles{background-color:var(--map-bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}

/* floating panel */
.panel{position:absolute;z-index:1000;left:16px;top:16px;bottom:16px;width:380px;max-width:calc(100% - 32px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;transition:transform .25s ease}
.panel.collapsed{transform:translateX(calc(-100% - 24px))}
.panel-tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line);flex:0 0 auto}
.ptab{flex:1;height:34px;border:0;border-radius:8px;background:none;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-soft);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ptab[aria-selected="true"]{background:var(--surface-2);color:var(--ink)}
.ptab .cnt{font:600 11px var(--mono);background:var(--gold);color:#212C46;border-radius:999px;padding:0 6px}
.pbody{flex:1 1 auto;overflow:auto;padding:16px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.handle{display:none}
.collapse-btn{position:absolute;z-index:1001;top:16px;left:404px;width:28px;height:44px;border-radius:0 8px 8px 0;border:1px solid var(--line);border-left:0;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center;color:var(--ink-soft);transition:left .25s ease}
.collapse-btn.out{left:0}
.collapse-btn svg{width:14px;height:14px;transition:transform .25s}
.collapse-btn.out svg{transform:rotate(180deg)}

h2.ph{font:700 20px/1.2 var(--serif);margin:0 0 4px;text-wrap:balance}
.eyebrow{font:600 10.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 6px}
.sub{color:var(--ink-soft);margin:0 0 14px;font-size:13px}
.section{margin-top:18px}
.section>h3{font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 8px}
.zone-badge{display:flex;gap:12px;align-items:center;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2)}
.zswatch{width:40px;height:40px;border-radius:8px;flex:0 0 auto;border:1px solid rgba(0,0,0,.15);display:grid;place-items:center;font:700 12px var(--mono);color:#131C33}
.zone-badge b{display:block;font-size:15px}
.zone-badge span{font-size:12.5px;color:var(--ink-soft)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px}
dl.kv dt{color:var(--ink-soft)}
dl.kv dd{margin:0;font-weight:500;text-align:right;overflow-wrap:anywhere}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#212C46}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:28px;padding:0 9px;font-size:12px}
.btn svg{width:15px;height:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.note{font-size:12.5px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.note.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--ink)}
.note.info{background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 30%,transparent);color:var(--ink)}
.empty-state{text-align:center;padding:26px 8px;color:var(--ink-soft)}
.empty-state svg{width:44px;height:44px;color:var(--ink-faint);margin-bottom:8px}
.tips{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:8px;text-align:left}
.tips li{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.qa{display:grid;gap:8px;margin-top:16px;text-align:left}
.qa button{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;font:inherit}
.qa button:hover{border-color:var(--line-strong);background:var(--surface-2)}
.qa button:focus-visible{outline:2px solid var(--navy-2);outline-offset:2px}
.qa .qi{flex:0 0 32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--navy-2)}
.qa .qi svg{width:18px;height:18px}
.qa b{display:block;font-size:13.5px}
.qa small{display:block;font-size:12px;color:var(--ink-soft);line-height:1.35}
.zkey{margin-top:22px;text-align:left}
.zkey h3{margin:0 0 8px}
.zkey ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.zkey li{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--ink);line-height:1.25;min-width:0}
.zkey .sw{flex:0 0 16px;height:16px;margin-top:-1px;border-radius:4px;border:1px solid rgba(0,0,0,.18)}
.zkey code{font:600 11px var(--mono);color:var(--ink-soft);flex:0 0 auto}
.zkey span.n{min-width:0}
.zkey code{min-width:30px}
.zkey .more{margin-top:10px;font-size:12px}
.zkey .more a{color:var(--navy-2);font-weight:600}
.pclose{float:right;margin:-4px -4px 0 8px;width:36px;height:36px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink-soft);cursor:pointer;display:grid;place-items:center}
.pclose:hover{background:var(--surface-2);border-color:var(--line)}
.pclose svg{width:18px;height:18px}

/* status pill + tracker */
.pill{display:inline-flex;align-items:center;gap:6px;font:600 11.5px var(--sans);padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.track{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:10px}
.track .st{height:6px;border-radius:3px;background:var(--line)}
.track .st.on{background:var(--c)}
.track-l{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font-size:10.5px;color:var(--ink-soft);margin-top:4px;line-height:1.2}
.track-l span.on{color:var(--ink);font-weight:600}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface)}
.alist{display:grid;gap:8px}
.aitem{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--surface);cursor:pointer}
.aitem:hover{border-color:var(--line-strong);background:var(--surface-2)}
.aitem .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.aitem b{font-size:13.5px}
.aitem .m{font-size:12px;color:var(--ink-soft);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip i{width:8px;height:8px;border-radius:50%}

/* layers */
.lrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .ln{flex:1;min-width:0}
.lrow .ln b{display:block;font-size:13.5px;font-weight:600}
.lrow .ln span{font-size:12px;color:var(--ink-soft)}
.switch{position:relative;width:38px;height:22px;flex:0 0 auto}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line-strong);transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+span{background:var(--navy-2)}
.switch input:checked+span::after{transform:translateX(16px)}
.switch input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.basemaps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bm{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 4px;cursor:pointer;font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--ink-soft)}
.bm .sw{width:100%;height:30px;border-radius:5px}
.bm[aria-pressed="true"]{border-color:var(--navy-2);color:var(--ink);box-shadow:0 0 0 1px var(--navy-2) inset}
.bm[disabled]{opacity:.45;cursor:not-allowed}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.lg{display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 4px;border-radius:6px;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink)}
.lg:hover{background:var(--surface-2)}
.lg[aria-pressed="false"]{opacity:.4}
.lg .sq{width:18px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.18);flex:0 0 auto}
.lg code{font:600 11px var(--mono);min-width:34px}
.range{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-soft)}
.range input{flex:1;accent-color:var(--navy-2)}

/* rail */
.rail{position:absolute;z-index:1000;right:16px;top:16px;display:flex;flex-direction:column;gap:8px}
.rgroup{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.rbtn{width:40px;height:40px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--ink);position:relative}
.rbtn+.rbtn{border-top:1px solid var(--line)}
.rbtn:hover{background:var(--surface-2)}
.rbtn[aria-pressed="true"]{background:var(--navy);color:#fff}
.rbtn svg{width:18px;height:18px}
.rbtn .tip{position:absolute;right:48px;top:50%;transform:translateY(-50%);background:var(--ink);color:var(--surface);font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.rbtn:hover .tip,.rbtn:focus-visible .tip{opacity:1}

.toolbar{position:absolute;z-index:1001;left:calc(50% + 200px);transform:translateX(-50%);top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:calc(100% - 32px)}
.toolbar .tv{font:600 15px var(--mono);font-variant-numeric:tabular-nums}
.toolbar .tl{font-size:12px;color:var(--ink-soft)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);height:28px;padding:0 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}

.coords{position:absolute;z-index:999;right:16px;bottom:26px;background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font:11.5px var(--mono);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.banner{position:absolute;z-index:999;left:412px;right:80px;bottom:24px;max-width:560px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;box-shadow:var(--shadow);padding:10px 36px 10px 12px;font-size:12.5px;color:var(--ink-soft)}
.banner b{color:var(--ink)}
.banner .x{position:absolute;right:6px;top:6px;width:24px;height:24px;border:0;background:none;cursor:pointer;color:var(--ink-faint);font-size:16px}
.toast{position:fixed;z-index:3000;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* map labels */
.plabel{font:600 10.5px var(--mono);color:#131C33;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}
.slabel{font:600 11px var(--sans);color:#56627E;letter-spacing:.02em;text-shadow:0 0 3px var(--map-bg),0 0 3px var(--map-bg)}
.pin-ico{width:28px;height:36px}
.vtx{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--navy-2)}

/* admin */
.admin{position:absolute;inset:0;z-index:1100;background:var(--bg);overflow:auto}
.admin-in{max-width:1180px;margin:0 auto;padding-block:20px 40px;padding-inline:16px}
.ahead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.ahead h1{font:700 26px/1.15 var(--serif);margin:0}
.anav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.anav button{border:0;background:none;padding:10px 14px;font-weight:600;font-size:13.5px;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.anav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .l{font-size:12px;color:var(--ink-soft);font-weight:600}
.stat .v{font:700 28px/1.1 var(--serif);margin-top:6px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--ink-faint);margin-top:2px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.box>h3{font:700 16px var(--serif);margin:0 0 12px}
.pipeline{display:grid;gap:10px}
.pipe{display:grid;grid-template-columns:230px 1fr 36px;align-items:center;gap:10px;font-size:13px}
.pipe .bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.pipe .bar i{display:block;height:100%;border-radius:5px}
.pipe .n{text-align:right;font:600 13px var(--mono)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
table.t th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td.act{white-space:nowrap;text-align:right}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--ink-soft)}
.field input,.field select,.field textarea{height:36px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:0 10px;width:100%}
.field textarea{height:auto;min-height:70px;padding:8px 10px;resize:vertical}
.field .hint{font-size:11.5px;color:var(--ink-faint)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.geo-tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gt{border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:8px 4px;cursor:pointer;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.gt svg{width:20px;height:20px}
.gt[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.geo-sum{margin-top:8px;font-size:12.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
pre.code{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font:12px/1.5 var(--mono);max-height:340px;margin:0}
.inline-confirm{display:inline-flex;gap:6px;align-items:center;font-size:12px}
.gate{max-width:440px;margin:10vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow)}
.gate h2{font:700 22px var(--serif);margin:0 0 6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.drop{display:block;cursor:pointer;border:2px dashed var(--line-strong);border-radius:12px;padding:20px 16px;text-align:center;color:var(--ink-soft);background:var(--surface-2)}
.drop svg{display:block;width:28px;height:28px;margin:0 auto;color:var(--navy-2)}
.drop:hover{border-color:var(--navy-2)}
.lyr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lyr:last-of-type{border-bottom:0}
.lyr .ln{flex:1;min-width:160px}
.lyr .ln b{display:block;font-size:13.5px}
.lyr .ln span{font-size:12px;color:var(--ink-soft)}
.drop.over{border-color:var(--navy-2);background:var(--info-bg)}

/* 3D view */
#map3d{position:absolute;inset:0;z-index:950;background:#dfe4ea}
#map3d .maplibregl-canvas{position:absolute;left:0;top:0}
#map3d .maplibregl-canvas-container.maplibregl-interactive{cursor:grab}
body.is3d .leaflet-control-container, body.is3d .coords, body.is3d #tPin, body.is3d #tMeasure{display:none}
.rbtn .b3{font:700 12px var(--sans);letter-spacing:.02em}
.ctl3d{position:absolute;z-index:1001;left:calc(50% + 200px);transform:translateX(-50%);bottom:18px;width:min(600px,calc(100% - 480px));min-width:300px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;display:grid;gap:8px}
.c3-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.c3-ex{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);margin-left:auto}
.c3-ex input{width:90px;accent-color:var(--navy-2)}
.c3-now{font:600 13px var(--sans);color:var(--ink);padding:6px 10px;border-radius:8px;background:var(--surface-2);border-left:3px solid var(--gold)}
.c3-attr{font-size:10.5px;color:var(--ink-faint)}

@media (max-width: 900px){
  .grid2{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width: 720px){
  /* one slim top row: seal · search · staff */
  .topbar{flex-wrap:nowrap;gap:8px;padding:6px 10px;padding-top:calc(6px + env(safe-area-inset-top,0px))}
  .brand-text{display:none}
  .seal{width:32px;height:32px}
  .search{flex:1 1 auto;max-width:none;min-width:0}
  .search input{height:38px;padding:0 36px 0 36px}
  .search .s-ico{left:12px}
  .results{position:fixed;left:8px;right:8px;top:calc(52px + env(safe-area-inset-top,0px));max-height:60vh}
  .tbtn .lbl{display:none}
  .tbtn{padding:0;width:38px;justify-content:center}
  input,select,textarea{font-size:16px!important}
  /* bottom sheet: peek / half / full */
  .panel{left:0;right:0;top:auto;bottom:0;width:auto;max-width:none;height:48%;border-radius:16px 16px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);transition:height .25s ease}
  .panel.collapsed{transform:none}
  .panel.sheet-peek{height:calc(96px + env(safe-area-inset-bottom,0px))}
  .panel.sheet-peek .pbody{overflow:hidden}
  .panel.sheet-half{height:48%}
  .panel.sheet-full{height:calc(100% - 10px)}
  .stage:has(.panel.sheet-full) .rail{visibility:hidden}
  .collapse-btn{display:none}
  body{position:fixed;inset:0;width:100%}
  .handle{display:block;width:100%;height:26px;border:0;padding:0;background:none;cursor:grab;flex:0 0 auto;position:relative;touch-action:none}
  .panel-tabs{touch-action:none}
  .panel.dragging{transition:none}
  .handle::after{content:"";position:absolute;left:50%;top:9px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line-strong)}
  .panel-tabs{padding:0 6px 6px}
  .ptab{height:32px;font-size:12.5px}
  .pbody{padding:12px 14px}
  h2.ph{font-size:18px}
  .section{margin-top:14px}
  .empty-state{padding:12px 4px}
  .empty-state > svg{display:none}
  .tips{display:none}
  .zone-badge{padding:10px}
  .zswatch{width:34px;height:34px}
  .rail{top:10px;right:10px;gap:6px}
  .rbtn{width:38px;height:38px}
  .rbtn .tip{display:none}
  .coords{display:none}
  .leaflet-control-scale{display:none}
  .leaflet-bottom{bottom:var(--sheet-h,0px);transition:bottom .25s ease}
  .banner{bottom:auto;top:10px;left:10px;right:58px;max-width:none;font-size:12px;padding:8px 30px 8px 10px}
  .toolbar{top:10px;left:10px;right:58px;transform:none;max-width:none;justify-content:space-between}
  .ctl3d{top:10px;bottom:auto;left:10px;right:58px;transform:none;width:auto;min-width:0;padding:8px 10px;gap:6px}
  .c3-ex{margin-left:0}
  .c3-row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .c3-row>*{flex:0 0 auto}
  .c3-ex input{width:70px}
  .c3-attr{display:none}
  .fgrid{grid-template-columns:1fr}
  .geo-tools .gt{padding:8px 2px;font-size:11.5px}
  /* staff dashboard */
  .admin-in{padding-block:14px 32px;padding-inline:12px}
  .ahead{margin-bottom:10px}
  .ahead h1{font-size:22px}
  .ahead .btnrow{width:100%}
  .ahead .btnrow .btn{flex:1 1 auto;justify-content:center}
  .stats{grid-template-columns:1fr 1fr;gap:8px}
  .stat{padding:10px 12px}
  .stat .v{font-size:22px}
  .box{padding:12px}
  .pipe{grid-template-columns:1fr 70px 26px;font-size:12px}
  .filters .btn{flex:1 1 auto;justify-content:center}
  .tablewrap{border:0;background:none;overflow:visible}
  table.t{min-width:0}
  table.t thead{display:none}
  table.t,table.t tbody,table.t tr,table.t td{display:block;width:100%}
  table.t tr{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  table.t td{border:0;padding:2px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}
  table.t td[data-l]::before{content:attr(data-l);color:var(--ink-soft);font-size:12px}
  table.t td.first{display:block;padding-bottom:6px}
  table.t td.act{justify-content:flex-end;padding-top:8px}
}

/* ---------- Theme: same look as the Building Department site (arabcityapplications.jadecruz.dev) ---------- */
body{font:14px/1.45 var(--sans)}
h1,h2,h3{letter-spacing:-.005em}

.sitebar .sb-tag{background:rgba(192,168,105,.18);color:#c0a869;border-radius:4px}
.sitebar .sb-secure{color:#d9d4c5}
.topbar{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);padding:10px 24px;gap:20px}

.ptab{border-radius:4px;font:600 13px var(--serif)}
.ptab[aria-selected="true"]{background:var(--sel);color:var(--ink)}

.eyebrow{font:600 11px var(--serif);letter-spacing:.14em;color:var(--gold-ink)}

/* ---- staff sign-in: same design as the Staff Portal (arabcityapplications.jadecruz.dev), map artwork ---- */
.admin.lgmode{position:fixed;inset:0;z-index:5000;background:#212c46;overflow:auto}
.loginbg{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;background:#212c46;display:flex;align-items:center;justify-content:center;padding:32px 16px 64px;font:15px/1.5 var(--sans)}
.lb-art{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 78% 30%,#2c3a5e 0%,#212c46 45%,#161d31 100%)}
.lb-grid{position:absolute;inset:-120px;background-image:linear-gradient(rgba(192,168,105,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(192,168,105,.09) 1px,transparent 1px),linear-gradient(rgba(192,168,105,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(192,168,105,.035) 1px,transparent 1px);background-size:120px 120px,120px 120px,24px 24px,24px 24px;animation:lbDrift 60s linear infinite}
@keyframes lbDrift{to{transform:translate3d(120px,120px,0)}}
.lb-plan{position:absolute;right:-1%;bottom:2%;width:min(980px,78vw);height:auto;opacity:.9}
.lb-plan .ln{fill:none;stroke:#c0a869;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--l,1600);stroke-dashoffset:var(--l,1600);animation:lbDraw 3.2s cubic-bezier(.6,.05,.3,1) forwards;animation-delay:var(--d,0s)}
.lb-plan .ln.thin{stroke-width:1.2;stroke:rgba(192,168,105,.65)}
.lb-plan .ln.white{stroke:rgba(255,255,255,.55)}
.lb-plan .ln.hair{stroke-width:.9;stroke:rgba(255,255,255,.22)}
.lb-plan .water{fill:rgba(120,160,220,.07);opacity:0;animation:lbFade 2s ease forwards;animation-delay:var(--d,0s)}
.lb-plan .lim{fill:none;stroke:rgba(255,255,255,.6);stroke-width:1.6;stroke-dasharray:10 6;opacity:0;animation:lbFade 1.6s ease forwards;animation-delay:var(--d,0s)}
.lb-plan .tb{fill:rgba(192,168,105,.16);font:600 7.5px/1 var(--sans);letter-spacing:.22em}
.lb-plan .dim{fill:rgba(192,168,105,.75);font:600 13px/1 var(--sans);letter-spacing:.08em;opacity:0;animation:lbFade 1s ease forwards;animation-delay:var(--d,0s)}
.lb-plan .dim.st{fill:rgba(255,255,255,.4);font-size:11px;letter-spacing:.18em}
.lb-plan .glow{fill:#c0a869;opacity:0;animation:lbWin 6s ease-in-out infinite;animation-delay:var(--d,4s)}
.lb-plan .mpin{animation:lbPin 2.4s ease-in-out infinite alternate;animation-delay:3s;transform-box:fill-box}
.lb-plan .pulse{fill:none;stroke:#c0a869;stroke-width:1.5;opacity:0;transform-origin:center;transform-box:fill-box;animation:lbPulse 2.4s ease-out infinite;animation-delay:var(--d,3.2s)}
.lb-plan .needle{transform-origin:center;transform-box:fill-box;animation:lbNeedle 9s ease-in-out infinite alternate}
.lb-ring{position:absolute;border-radius:50%;border:2px solid rgba(192,168,105,.14);animation:lbSpin 90s linear infinite}
@keyframes lbDraw{to{stroke-dashoffset:0}}
@keyframes lbFade{to{opacity:1}}
@keyframes lbWin{0%,100%{opacity:0}45%,60%{opacity:.55}}
@keyframes lbPin{from{transform:translateY(0)}to{transform:translateY(-16px)}}
@keyframes lbPulse{0%{opacity:.7;transform:scale(.4)}100%{opacity:0;transform:scale(1.8)}}
@keyframes lbNeedle{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes lbSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.lb-grid,.lb-ring,.lb-plan .mpin,.lb-plan .pulse,.lb-plan .needle,.lb-plan .glow{animation:none}.lb-plan .ln{animation:none;stroke-dashoffset:0}.lb-plan .dim,.lb-plan .lim,.lb-plan .water{animation:none;opacity:1}}
@media (max-width:860px){.lb-plan{width:150vw;right:-40vw;opacity:.45}}

.lb-wrap{position:relative;z-index:1;width:100%;max-width:1040px;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:56px;align-items:center}
.lb-hero{color:#fff}
.lb-hero .lb-logo{display:block;width:112px;height:112px;margin:0 0 22px;border-radius:50%;box-shadow:0 10px 30px rgba(0,0,0,.35);background:transparent}
.lb-kicker{display:inline-block;font-size:12.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#c0a869;padding-bottom:10px;border-bottom:2px solid #c0a869}
.lb-hero h2{font:800 clamp(34px,4.6vw,54px)/1.04 var(--serif);margin:18px 0 14px;letter-spacing:-.01em;text-shadow:0 2px 24px rgba(0,0,0,.35);color:#fff}
.lb-hero h2 em{font-style:normal;color:#c0a869}
.lb-hero p{margin:0;max-width:34ch;font-size:17px;line-height:1.5;color:rgba(255,255,255,.85)}
.loginbg .pin{margin:0;max-width:none;background:color-mix(in srgb,var(--surface) 97%,transparent);border-radius:14px;padding:28px;display:grid;gap:12px;text-align:center;color:var(--ink);border-top:4px solid #c0a869;box-shadow:0 30px 80px rgba(3,10,30,.55),0 2px 0 rgba(255,255,255,.4) inset;backdrop-filter:blur(6px)}
.loginbg .pin h1{font:800 22px var(--serif);margin:0;color:var(--ink)}
.loginbg .pin p{margin:0;color:var(--ink-faint);font-size:14px;line-height:1.5}
.loginbg .fld{display:flex;flex-direction:column;gap:5px;min-width:0;text-align:left}
.loginbg .fld label{font-weight:600;font-size:14px;color:var(--ink)}
.loginbg .fld input{border:1px solid var(--line);border-radius:7px;padding:10px 12px;background:var(--surface);color:var(--ink);width:100%;min-width:0;font-family:var(--sans);font-size:16px;line-height:1.5;letter-spacing:0;text-align:left;height:auto;box-sizing:border-box}
.loginbg .fld input[type=password]{border-radius:8px;padding:12px}
.loginbg .fld input:focus{outline:2px solid var(--navy);outline-offset:0;border-color:transparent}
.loginbg .opt{display:flex;gap:8px;align-items:flex-start;font-size:14px;text-align:left;cursor:pointer;color:var(--ink)}
.loginbg .opt input{margin-top:3px}
.loginbg .formerr{color:#b42318;font-weight:600;font-size:14px}
.loginbg .lbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;background:transparent;color:var(--ink);border-radius:6px;padding:8px 14px;font:600 14px/1.5 var(--sans);cursor:pointer;text-decoration:none}
.loginbg .lbtn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.loginbg .lbtn.primary:hover{background:var(--navy-2);border-color:var(--navy-2)}
.loginbg .lbtn.out{border-color:var(--line);background:var(--surface)}
.loginbg .lbtn[disabled]{opacity:.5;cursor:not-allowed}
.loginbg .pwhelp{display:grid;gap:10px}
.loginbg .pwhelp[hidden]{display:none}
.loginbg .pwhelp-msg{display:flex;gap:8px;align-items:flex-start;text-align:left;font-size:13.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink)}
.lb-ver{position:absolute;left:18px;bottom:20px;z-index:1;font-size:12px;color:rgba(255,255,255,.6)}
@media (max-width:860px){.lb-wrap{grid-template-columns:1fr;gap:22px;max-width:420px}.lb-hero{text-align:center}.lb-hero .lb-logo{width:72px;height:72px;margin:0 auto 14px}.lb-hero h2{font-size:30px;margin:12px 0 6px}.lb-hero p{display:none}.loginbg{align-items:flex-start;padding-top:28px}.lb-shade{background:linear-gradient(180deg,rgba(24,32,52,.6) 0%,rgba(24,32,52,.85) 60%,rgba(24,32,52,.95) 100%)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .loginbg .pin{border-top-color:#c0a869}}

/* ---- staff dashboard: Staff Portal workspace layout (navy top bar + side menu) ---- */
.admin.wsmode{position:fixed;inset:0;z-index:5000;background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.jt-top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:18px;padding:0 18px;height:60px;flex:none;border-bottom:3px solid var(--gold);position:relative;z-index:20}
.jt-top .sp{flex:1}
.jt-brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;min-width:0}
.jt-brand img{width:40px;height:40px;border-radius:50%;flex:none}
.jt-brand .bname{display:grid;font:800 19px/1.1 var(--serif);white-space:nowrap}
.jt-brand .bname small{font:600 12px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#e9e3d4}
.wsw{display:inline-flex;margin-left:14px;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.wsw button{border:0;background:transparent;color:#fff;font:600 13px var(--sans);padding:6px 12px;border-radius:999px;cursor:pointer;opacity:.8}
.wsw button.on{background:#fff;color:var(--navy);opacity:1}
.pm{position:relative;display:flex;align-items:center}
.pm-btn{display:flex;align-items:center;gap:10px;background:none;border:0;color:#e9e3d4;cursor:pointer;font:500 14px var(--sans);padding:4px 6px;border-radius:999px}
.pm-btn:hover,.pm-btn[aria-expanded=true]{background:rgba(255,255,255,.08)}
.pm-car{font-size:11px;opacity:.8}
.avatar{width:36px;height:36px;border-radius:50%;border:2px solid var(--gold);background:var(--navy-2);color:#fef6e9;display:grid;place-items:center;font:800 10px var(--serif);flex:none}
.pm-menu{position:absolute;right:0;top:calc(100% + 8px);width:300px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(6,10,40,.22);padding:8px;z-index:40;display:grid}
.pm-menu[hidden]{display:none}
.pm-who{display:flex;gap:12px;align-items:center;padding:10px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.pm-who>div{display:grid;min-width:0}
.pm-who b{font-size:15px}
.pm-who span{font-size:12.5px;color:var(--ink-faint);overflow-wrap:anywhere}
.pm-who .pm-role{color:var(--gold-ink);font-weight:600}
.pm-menu [role=menuitem]{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:10px;font:500 14px var(--sans);color:var(--ink);cursor:pointer;text-decoration:none}
.pm-menu [role=menuitem]:hover,.pm-menu [role=menuitem]:focus-visible{background:var(--sel);outline:none}
.pm-menu [role=menuitem] svg{width:18px;height:18px;color:var(--ink-soft)}
.pm-sep{height:1px;background:var(--line);margin:6px 4px}
.pm-out{color:#b42318!important}
.ws{flex:1;min-height:0;display:grid;grid-template-columns:285px minmax(0,1fr)}
.ws-side{background:var(--surface);border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.ws-side .create{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--gold);color:var(--navy);border:0;border-radius:4px;padding:11px;font:700 14px var(--sans);letter-spacing:.02em;cursor:pointer}
.ws-side .create svg{width:16px;height:16px}
.ws-side h4{margin:8px 6px 0;font-size:14px;color:var(--ink-soft);font-weight:600}
.ws-meter{background:#e6efe9;border-radius:8px;padding:12px 14px;font-size:13.5px;color:var(--ink)}
.ws-meter .row{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.ws-meter .row span{font-weight:600}
.ws-meter p{margin:8px 0 0;color:var(--ink-soft);font-size:13px;line-height:1.45}
.ws-meter .dotx{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2f8f5b;margin-right:6px;vertical-align:1px}
.navi{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;color:var(--ink-soft);text-decoration:none;font:500 14px var(--sans);background:none;border:0;width:100%;text-align:left;cursor:pointer}
.navi svg{width:18px;height:18px;flex:none}
.navi:hover{background:var(--surface-2)}
.navi.on{background:#ece2c6;color:var(--navy);font-weight:600}
.navi.stat{cursor:default;justify-content:space-between}
.navi.stat:hover{background:none}
.navi .num{font-variant-numeric:tabular-nums}
.ws-main{background:var(--surface);min-width:0;overflow:auto;display:flex;flex-direction:column}
.ws-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ws-bar h1{font:800 20px/1.2 var(--serif);margin:0;color:var(--ink)}
.ws-bar .sub{margin:2px 0 0;font-size:13px;color:var(--ink-faint)}
.ws-body{padding:18px 22px 40px}
.ws-body .stats{margin-top:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .navi.on{background:#3a3626;color:#f4efe4}:root:not([data-theme="light"]) .ws-meter{background:#1f3329}}
:root[data-theme="dark"] .navi.on{background:#3a3626;color:#f4efe4}
:root[data-theme="dark"] .ws-meter{background:#1f3329}
@media (max-width:860px){.ws{grid-template-columns:1fr;grid-template-rows:auto 1fr}.ws-side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px;gap:6px}.ws-side h4,.ws-side .ws-meter,.ws-side .navi.stat,.ws-side .create{display:none}.ws-side .navi{width:auto;white-space:nowrap}.jt-brand .bname small,.pm-name{display:none}.wsw{margin-left:0}.ws-body{padding:14px 12px 32px}}
</style>

  if((c===-1||c===0)&&(r===-1||r===0)) return "HD";

function buildSampleParcels(){
  const rand=rng(7), feats=[]; let n=0;
  for(let c=-3;c<=2;c++) for(let r=-3;r<=2;r++){
    const zone=sampleZone(c,r), x0=c*BX+10, x1=c*BX+BX-10, y0=r*BY+10, y1=r*BY+BY-10;
    const per = zone==="OSP"||zone==="AG"||zone==="M-1"||zone==="MHP"||zone==="SD" ? 1 : (zone==="GB"||zone==="HD"||zone==="O-I"||zone==="UM"||zone==="NC"||zone==="R-3") ? 3 : 4;
    const halves = per===1 ? 1 : 2;
    for(let h=0;h<halves;h++){
      const ya = halves===1? y0 : (h===0? y0 : (y0+y1)/2), yb = halves===1? y1 : (h===0? (y0+y1)/2 : y1);
      const fronting = h===0 ? EW_STREETS[String(r)] : EW_STREETS[String(r+1)];
      for(let i=0;i<per;i++){
        n++;
        const xa = x0+(x1-x0)*i/per, xb = x0+(x1-x0)*(i+1)/per;
        const cx=(xa+xb)/2, side = cx<0?"W":"E";
        const num = 100*Math.max(1,Math.abs(c)+(cx<0?0:1)) + Math.round(Math.abs(cx)%140/10)*2 + (h===0?1:0);
        const street = per===1 ? (EW_STREETS[String(r)]||"Central Ave") : (fronting||"Central Ave");
        const area = Math.abs(xb-xa)*Math.abs(yb-ya); // m²
        const acres = area/4046.86;
        const val = Math.round((zone==="GB"||zone==="HD"?260000:zone==="R-1"?185000:zone==="M-1"?420000:150000)*(0.7+rand()*0.7)/100)*100;
        feats.push({type:"Feature",geometry:rect(xa,ya,xb,yb),properties:{
          ZONE:zone, PARCELNUMB:"SAMPLE-"+String(1300+n), PROPPIN:String(90000+n),
          OWNER:"Sample Owner "+String.fromCharCode(65+(n%26))+(n>26?Math.floor(n/26):""),

      }
    }
  }
  return {type:"FeatureCollection",features:feats};
}

  name(){ const u=this.user; return u ? (u.name||u.email.split("@")[0]) : ""; },
  async restore(){ this.ready=true; if(!this.enabled()||!this.token) return; if(isPhone()){ this.user=null; return; } try{ this.user=await sbRpc("zm_me",{p_token:this.token}); if(!this.user) this.clear(); }catch(e){ this.clear(); } },
  async login(email,pw,remember){ if(isPhone()) throw new Error("Staff sign-in works on a computer or iPad.");

  async _finish(r){

      const e=new Error(r.mustChangePw?"Your login has a temporary password. Sign in to the Staff Portal once to choose your own, then come back here.":"Your login needs 2-step verification set up first. Sign in to the Staff Portal to set it up, then come back here."); e.portal=true; throw e; }

    this.token=r.token; this.user=me; lsSet("arabmap.token",r.token); return "ok"; },

function getCfg(){ return Object.assign({}, CONFIG, lsGet("arabmap.cfg",{})); }
const Store = {
  mode:"loading", rows:[], listeners:new Set(), lastSync:null, error:"", db:null, timer:null,
  on(fn){ this.listeners.add(fn); },
  emit(){ this.listeners.forEach(f=>{ try{ f(this.rows); }catch(e){ console.error(e); } }); },
  async init(){
    clearInterval(this.timer);
    const cfg=getCfg(); this.error="";
    if(Auth.enabled()){
      try{ this.mode="cloud"; await this.pullCloud();
        this.timer=setInterval(()=>this.pullCloud().catch(()=>{}), Math.max(15,+cfg.REFRESH_SECONDS||60)*1000);
        return;
      }catch(e){ this.error="Couldn't reach the map database: "+e.message; }
    }
    if(cfg.SHEET_API){
      try{ this.mode="sheet"; await this.pullSheet();
        this.timer=setInterval(()=>this.pullSheet().catch(()=>{}), Math.max(15,+cfg.REFRESH_SECONDS||60)*1000);
        return;
      }catch(e){ this.error="Couldn't reach the Google Sheet: "+e.message; }
    }
    const db = await getCap("db");
    if(db){
      this.db=db; this.mode="db";
      await new Promise(res=>{
        let first=true;
        db.collection("properties").onSnapshot(s=>{
          this.rows=s.docs.map(d=>Object.assign({},d.data(),{id:d.id})); this.lastSync=new Date().toISOString(); this.emit();
          if(first){ first=false; res(); }
        }, err=>{ this.error="Preview database: "+(err&&err.code||"error"); toast(this.error); if(first){first=false;res();} });
        setTimeout(res,8000);
      });
      return;
    }
    this.mode="local"; this.rows=lsGet("arabmap.rows",null) || sampleProperties(); this.lastSync=new Date().toISOString(); this.emit();
  },
  async pullCloud(){
    const rows=await sbRpc("zm_list_properties",{p_token:Auth.user?Auth.token:null});
    this.rows=(rows||[]).map(x=>Object.assign({},x,{id:String(x.id)})); this.lastSync=new Date().toISOString(); this.emit();
  },
  async pullSheet(){
    const cfg=getCfg();
    const u = cfg.SHEET_API + (cfg.SHEET_API.includes("?")?"&":"?") + "action=list" + (Admin.unlocked && cfg.SHEET_KEY ? "&key="+encodeURIComponent(cfg.SHEET_KEY) : "");
    const r = await fetch(u,{cache:"no-store"}); if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json(); if(!j.ok) throw new Error(j.error||"bad response");
    this.rows = (j.rows||[]).map(x=>Object.assign({},x,{id:String(x.id||uid())})); this.lastSync=new Date().toISOString(); this.emit();
  },
  async post(body){
    const cfg=getCfg();
    const r = await fetch(cfg.SHEET_API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({key:cfg.SHEET_KEY},body))});
    const j = await r.json(); if(!j.ok) throw new Error(j.error||"The sheet refused the change");
    return j;
  },
  async upsert(row){
    row = Object.assign({}, row, {updated_at:new Date().toISOString(), updated_by: row.updated_by || "staff"});
    if(this.mode==="cloud"){ const r=Object.assign({},row); delete r.updated_by; await sbRpc("zm_upsert_property",{p_token:Auth.token,p_row:r}); await this.pullCloud(); }
    else if(this.mode==="sheet"){ await this.post({action:"upsert",row}); await this.pullSheet(); }
    else if(this.mode==="db"){ const {id,...data}=row; await this.db.doc("properties/"+id).set(data); }
    else { const i=this.rows.findIndex(r=>r.id===row.id); if(i>=0) this.rows[i]=row; else this.rows.push(row); lsSet("arabmap.rows",this.rows); this.emit(); }
  },
  async remove(id){
    if(this.mode==="cloud"){ await sbRpc("zm_delete_property",{p_token:Auth.token,p_id:id}); await this.pullCloud(); }
    else if(this.mode==="sheet"){ await this.post({action:"delete",id}); await this.pullSheet(); }
    else if(this.mode==="db"){ await this.db.doc("properties/"+id).delete(); }
    else { this.rows=this.rows.filter(r=>r.id!==id); lsSet("arabmap.rows",this.rows); this.emit(); }
  },
  label(){ return {cloud:"Saved for everyone", sheet:"Live from Google Sheet", db:"Preview database (shared)", local:"Sample data in this browser", loading:"Connecting…"}[this.mode]; },
};
const visibleRows = () => Store.rows.filter(r => Admin.unlocked || String(r.public||"Y").toUpperCase()!=="N");

let parcelData=null, parcelLayer=null, labelLayer=L.layerGroup(), limitsLayer=null, gasLayer=null, gasData=null, limitsData=null;
const cleanV = v => { v=String(v??"").trim(); return (/^(null|none|0)$/i.test(v) || /^[,\s]*$/.test(v) || /\bnull\b/i.test(v)) ? "" : v; };
const P = f => { const p=f.properties||{}; const g=k=>p[k]??p[k.toLowerCase()]??""; return {
  zone:zoneOf(g("ZONE")||g("ZONING")), ppin:cleanV(g("PROPPIN")||g("PPIN")), parcel:cleanV(g("PARCELNUMB")||g("PARCEL")||g("PIN")),
  owner:cleanV(g("OWNER")), address:cleanV(String(g("PROPADDR")||g("ADDRESS")||"").replace(/^0\s+/,"")), mail:cleanV(g("MAILADDR")||[g("MAILADD1"),g("MAILADD2"),g("MAILADD3")].filter(Boolean).join(", ")),
  value:g("PROPVALUE"), acres:g("ACREAGE")||g("CALCACRES")||g("DEEDEDARE"), sqft:g("AREA"), limit:String(g("CITYLIMIT")||""), county:String(g("COUNTY")||""), sd:String(g("SD_OVERLAY")||"").toUpperCase()==="Y", sample:!!p.SAMPLE }; };

async function tryFetchJSON(url){ try{ const r=await fetch(url,{cache:"no-cache"}); if(!r.ok) return null; return await r.json(); }catch(e){ return null; } }
async function idbGet(key){ return new Promise(res=>{ try{ const o=indexedDB.open("arabmap",1); o.onupgradeneeded=()=>o.result.createObjectStore("kv"); o.onsuccess=()=>{ try{ const tx=o.result.transaction("kv","readonly").objectStore("kv").get(key); tx.onsuccess=()=>res(tx.result||null); tx.onerror=()=>res(null);}catch(e){res(null);} }; o.onerror=()=>res(null); }catch(e){ res(null); } }); }
async function idbSet(key,val){ return new Promise(res=>{ try{ const o=indexedDB.open("arabmap",1); o.onupgradeneeded=()=>o.result.createObjectStore("kv"); o.onsuccess=()=>{ try{ const tx=o.result.transaction("kv","readwrite"); tx.objectStore("kv").put(val,key); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);}catch(e){res(false);} }; o.onerror=()=>res(false); }catch(e){ res(false); } }); }

async function loadMapData(){

  let pi=null, li=null, gi=null;
  if(cl){ const ov=k=> cl[k] ? (cl[k].geojson || {type:"FeatureCollection",features:[]}) : null; pi=ov("parcels"); li=ov("limits"); gi=ov("gas"); }
  else { [pi,li,gi]=await Promise.all([idbGet("parcels"), idbGet("limits"), idbGet("gas")]); }
  parcelData = pi || pf || buildSampleParcels(); State.sample.parcels = !(pi||pf);
  limitsData = li || lf || buildSampleLimits(); State.sample.limits = !(li||lf);
  gasData = gi || gf || buildSampleGas(); State.sample.gas = !(gi||gf);
  const where = cl ? "for everyone" : "in this browser";
  const nt=(i,f,path)=> i ? (i.features&&i.features.length?"Uploaded by staff "+where:"Removed "+where) : f ? "From "+path : "Sample data";
  State.sourceNote = {parcels:nt(pi,pf,CONFIG.DATA_FILES.parcels), limits:nt(li,lf,CONFIG.DATA_FILES.limits), gas:nt(gi,gf,CONFIG.DATA_FILES.gas)};

let INDEX=[];
function buildIndex(){
  INDEX=[];
  if(parcelLayer) parcelLayer.eachLayer(l=>{ const p=P(l.feature); const f=l.feature;
    if(p.address) INDEX.push({k:"Address",t:p.address,s:(p.owner||"")+" · "+p.zone,ref:{kind:"parcel",feature:f},key:p.address.toLowerCase()});
    if(p.owner) INDEX.push({k:"Owner",t:p.owner,s:p.address+" · "+p.zone,ref:{kind:"parcel",feature:f},key:p.owner.toLowerCase()});
    if(p.ppin) INDEX.push({k:"PPIN",t:p.ppin,s:p.address,ref:{kind:"parcel",feature:f},key:p.ppin.toLowerCase()});
    if(p.parcel) INDEX.push({k:"Parcel #",t:p.parcel,s:p.address,ref:{kind:"parcel",feature:f},key:p.parcel.toLowerCase().replace(/[^a-z0-9]/g,"")});
  });

function searchLocal(q){
  q=q.trim().toLowerCase(); if(q.length<2) return [];

  const out=[];
  for(const it of INDEX){
    let s=0; const key=it.key;
    if(it.k==="Parcel #"){ if(qn.length>=3 && key.includes(qn)) s = key.startsWith(qn)?90:60; }
    else if(key.startsWith(q)) s=100; else if(words.every(w=>key.includes(w))) s=70-key.indexOf(words[0])/100;

  else if(fly && g){ if(g.type==="Point") flyPoint(L.latLng(g.coordinates[1],g.coordinates[0]),17); else map.flyToBounds(L.geoJSON(g).getBounds(),Object.assign({maxZoom:18},fitPad())); }

/* Phones can't sign in (iPads and computers can). iPadOS reports a desktop Mac user agent, so check touch points too. */
function isPhone(){ const ua=navigator.userAgent||""; if(/iPad/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints>1)) return false;
  if(/iPhone|iPod|Windows Phone|Android.+Mobile/i.test(ua)) return true;
  return !!(window.matchMedia && matchMedia("(pointer:coarse)").matches && Math.min(screen.width,screen.height)<600); }
function setSheet(st){ const p=$("#panel"); p.classList.remove("sheet-peek","sheet-half","sheet-full"); p.classList.add("sheet-"+st); State.sheet=st; const sh=$("#stage").clientHeight; document.documentElement.style.setProperty("--sheet-h", Math.round(st==="peek"?96:st==="half"?sh*0.48:sh-10)+"px"); $("#handle").setAttribute("aria-label",st==="full"?"Shrink panel":"Expand panel"); }

function flyPoint(ll,z){ const pad=fitPad(); const dx=(pad.paddingTopLeft[0]-pad.paddingBottomRight[0])/2, dy=(pad.paddingTopLeft[1]-pad.paddingBottomRight[1])/2; const c=map.unproject(map.project(ll,z).subtract([dx,dy]),z); map.flyTo(c,z); }

$("#collapseBtn").onclick=()=>setPanelOpen($("#panel").classList.contains("collapsed"));
$("#handle").onclick=()=>{ if($("#panel")._justDragged) return; setSheet(({peek:"half",half:"full",full:"peek"})[State.sheet||"half"]); };
/* Bottom sheet: follow the finger while dragging the handle or tab strip, then snap to peek / half / full. */
(function(){
  const p=$("#panel"); let dragging=false, moved=false, startY=0, startH=0, lastY=0, lastT=0, vel=0;
  const snaps=()=>{ const sh=$("#stage").clientHeight; return {peek:96, half:sh*0.48, full:sh-10}; };
  const pt=e=>(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;
  function down(e){ if(!isMobile()) return; const t=pt(e); startY=lastY=t.clientY; lastT=performance.now(); startH=p.getBoundingClientRect().height; dragging=true; moved=false; vel=0; }
  function move(e){ if(!dragging) return; const t=pt(e), dy=startY-t.clientY;
    if(!moved){ if(Math.abs(dy)<6) return; moved=true; p.classList.add("dragging"); }
    const s=snaps(); p.style.height=Math.max(s.peek,Math.min(s.full,startH+dy))+"px";
    const now=performance.now(); vel=(lastY-t.clientY)/Math.max(1,now-lastT); lastY=t.clientY; lastT=now;
    if(e.cancelable) e.preventDefault(); }
  function up(){ if(!dragging) return; dragging=false; if(!moved) return;
    const h=p.getBoundingClientRect().height, s=snaps(); p.classList.remove("dragging"); p.style.height="";
    let st; if(vel>0.45) st = h<s.half ? "half" : "full"; else if(vel<-0.45) st = h>s.half ? "half" : "peek";
    else st=Object.keys(s).reduce((a,k)=>Math.abs(s[k]-h)<Math.abs(s[a]-h)?k:a,"half");
    setSheet(st); p._justDragged=true; setTimeout(()=>{ p._justDragged=false; },350); }

  window.addEventListener("touchmove",move,{passive:false}); window.addEventListener("touchend",up); window.addEventListener("touchcancel",up);
  window.addEventListener("pointermove",e=>{ if(e.pointerType==="mouse") move(e); }); window.addEventListener("pointerup",e=>{ if(e.pointerType==="mouse") up(); });
  $("#ptabs").addEventListener("click",e=>{ if(p._justDragged){ e.stopImmediatePropagation(); e.preventDefault(); } },true);
  window.addEventListener("resize",()=>{ if(isMobile()) setSheet(State.sheet||"half"); });
})();

const toolLayer = L.layerGroup().addTo(map);
let pinMarker=null;
const pinIcon = L.divIcon({className:"",iconSize:[28,36],iconAnchor:[14,35],popupAnchor:[0,-32],html:'<svg class="pin-ico" viewBox="0 0 28 36"><path d="M14 35s12-11.7 12-20.5A12 12 0 002 14.5C2 23.3 14 35 14 35z" fill="#B8322A" stroke="#fff" stroke-width="2"/><circle cx="14" cy="14" r="4.5" fill="#fff"/></svg>'});
function parcelAt(ll){
  let hit=null; if(!parcelLayer) return null;
  parcelLayer.eachLayer(l=>{ if(hit) return; if(!l.getBounds().contains(ll)) return; if(pointInGeom(ll,l.feature.geometry)) hit=l.feature; });
  return hit;
}
function pointInRing(x,y,r){ let ins=false; for(let i=0,j=r.length-1;i<r.length;j=i++){ const xi=r[i][0],yi=r[i][1],xj=r[j][0],yj=r[j][1]; if(((yi>y)!==(yj>y)) && (x<(xj-xi)*(y-yi)/(yj-yi)+xi)) ins=!ins; } return ins; }
function pointInGeom(ll,g){ const x=ll.lng,y=ll.lat; const polys = g.type==="Polygon"?[g.coordinates]:g.type==="MultiPolygon"?g.coordinates:[]; return polys.some(p=>pointInRing(x,y,p[0]) && !p.slice(1).some(h=>pointInRing(x,y,h))); }
function dropPin(ll){
  if(pinMarker) toolLayer.removeLayer(pinMarker);
  const f=parcelAt(ll), p=f?P(f):null;
  pinMarker=L.marker(ll,{icon:pinIcon,pane:"toolPane"}).addTo(toolLayer);
  const html='<div style="min-width:200px"><div class="eyebrow" style="margin:0 0 4px">Dropped pin</div><div class="mono" style="font-size:13px;font-weight:600">'+ll.lat.toFixed(6)+', '+ll.lng.toFixed(6)+'</div>'+
    (p?'<div style="margin-top:6px;font-size:12.5px">'+esc(p.address||"Parcel")+' · <b>'+esc(p.zone)+'</b> '+esc(ZONES[p.zone].name)+'</div>':'<div style="margin-top:6px;font-size:12.5px;color:var(--ink-soft)">No parcel at this spot</div>')+
    '<div class="btnrow" style="margin-top:10px"><button class="btn sm" id="pinCopy">Copy coordinates</button>'+(p?'<button class="btn sm primary" id="pinOpen">Open parcel</button>':'')+'<button class="btn sm ghost" id="pinDel">Remove</button></div></div>';
  pinMarker.bindPopup(html,{closeButton:true}).openPopup();
  pinMarker.on("popupopen",bindPin); bindPin();
  function bindPin(){ setTimeout(()=>{ const a=$("#pinCopy"); if(a) a.onclick=()=>copyText(ll.lat.toFixed(6)+", "+ll.lng.toFixed(6),"Coordinates copied"); const b=$("#pinOpen"); if(b) b.onclick=()=>{ map.closePopup(); selectParcel(f,false); }; const d=$("#pinDel"); if(d) d.onclick=()=>{ toolLayer.removeLayer(pinMarker); pinMarker=null; }; },0); }
}
function setMode(m){
  State.mode = (State.mode===m && (m==="pin"||m==="measure")) ? null : m;
  if(!State.mode && Admin.form) State.mode="form";
  $("#tPin").setAttribute("aria-pressed",State.mode==="pin");
  $("#tMeasure").setAttribute("aria-pressed",State.mode==="measure");
  map.getContainer().classList.toggle("leaflet-crosshair",!!State.mode && State.mode!=="form");
  if(State.mode!=="measure") Measure.stop();
  if(State.mode==="form"){ hideToolbar(); return; }
  if(isMobile() && (State.mode==="measure"||State.mode==="pin")) setSheet("peek");
  if(State.mode==="measure") Measure.start();
  else if(State.mode==="pin"){ showToolbar('<span class="tl">Tap the map to drop a pin</span><button class="btn sm" id="tbDone">Done</button>'); $("#tbDone").onclick=()=>setMode(null); }
  else if(!State.mode) hideToolbar();
}
function showToolbar(h){ const t=$("#toolbar"); t.innerHTML=h; t.hidden=false; }
function hideToolbar(){ $("#toolbar").hidden=true; }
$("#tPin").onclick=()=>{ Admin.cancelGeo(); setMode("pin"); };

$("#zin").onclick=()=>View3D.on&&View3D.map ? View3D.map.zoomIn() : map.zoomIn(); $("#zout").onclick=()=>View3D.on&&View3D.map ? View3D.map.zoomOut() : map.zoomOut();

$("#tLocate").onclick=()=>{
  if(!navigator.geolocation){ toast("Location isn't available on this device"); return; }
  toast("Finding your location…");
  navigator.geolocation.getCurrentPosition(p=>{ const ll=L.latLng(p.coords.latitude,p.coords.longitude); flyPoint(ll,18); L.circle(ll,{radius:p.coords.accuracy,color:"#2F6BFF",weight:1,fillOpacity:.1,pane:"toolPane"}).addTo(toolLayer); L.circleMarker(ll,{radius:7,color:"#fff",weight:3,fillColor:"#2F6BFF",fillOpacity:1,pane:"toolPane"}).addTo(toolLayer); },
    ()=>toast("Location was blocked. Allow location access in your browser and try again."),{enableHighAccuracy:true,timeout:10000});
};

function geoArea(lls){ const R=6378137; let a=0; const n=lls.length; if(n<3) return 0; for(let i=0;i<n;i++){ const p1=lls[i],p2=lls[(i+1)%n]; a+=(p2.lng-p1.lng)*Math.PI/180*(2+Math.sin(p1.lat*Math.PI/180)+Math.sin(p2.lat*Math.PI/180)); } return Math.abs(a*R*R/2); }
const fmtFeet = m => { const ft=m*3.28084; return ft>=5280 ? (ft/5280).toFixed(2)+" mi" : Math.round(ft).toLocaleString()+" ft"; };
const fmtArea = m2 => { const ac=m2/4046.86; return ac>=0.5 ? ac.toFixed(2)+" acres" : Math.round(m2*10.7639).toLocaleString()+" sq ft"; };
const Measure = {
  pts:[], kind:"distance", line:null, verts:L.layerGroup(),
  start(){ this.pts=[]; this.verts.addTo(toolLayer); this.draw(); },
  stop(){ this.pts=[]; if(this.line){ toolLayer.removeLayer(this.line); this.line=null; } this.verts.clearLayers(); if(!State.mode) hideToolbar(); },
  add(ll){ this.pts.push(ll); this.draw(); },
  draw(){
    if(this.line) toolLayer.removeLayer(this.line);
    this.verts.clearLayers();
    const opts={color:"#B8322A",weight:3,dashArray:"6 5",pane:"toolPane",interactive:false};
    if(this.pts.length) this.line = (this.kind==="area" && this.pts.length>2 ? L.polygon(this.pts,Object.assign({fillOpacity:.15,fillColor:"#B8322A"},opts)) : L.polyline(this.pts,opts)).addTo(toolLayer);
    this.pts.forEach(p=>this.verts.addLayer(L.circleMarker(p,{radius:4,color:"#B8322A",weight:2,fillColor:"#fff",fillOpacity:1,pane:"toolPane",interactive:false})));
    let d=0; for(let i=1;i<this.pts.length;i++) d+=map.distance(this.pts[i-1],this.pts[i]);
    if(this.kind==="area" && this.pts.length>2) d+=map.distance(this.pts[this.pts.length-1],this.pts[0]);
    const val = this.kind==="area" ? (this.pts.length>2? fmtArea(geoArea(this.pts)) : "—") : (this.pts.length>1? fmtFeet(d) : "—");
    showToolbar('<div class="seg"><button data-k="distance" aria-pressed="'+(this.kind==="distance")+'">Distance</button><button data-k="area" aria-pressed="'+(this.kind==="area")+'">Area</button></div>'+
      '<div><div class="tv">'+val+'</div><div class="tl">'+(this.kind==="area"&&this.pts.length>2?"Perimeter "+fmtFeet(d):"Tap the map to add points")+'</div></div>'+
      '<button class="btn sm" id="mUndo"'+(this.pts.length?'':' disabled')+'>Undo</button><button class="btn sm" id="mClear"'+(this.pts.length?'':' disabled')+'>Clear</button><button class="btn sm primary" id="mDone">Done</button>');
    $$("#toolbar [data-k]").forEach(b=>b.onclick=()=>{ this.kind=b.dataset.k; this.draw(); });
    $("#mUndo").onclick=()=>{ this.pts.pop(); this.draw(); };
    $("#mClear").onclick=()=>{ this.pts=[]; this.draw(); };
    $("#mDone").onclick=()=>setMode(null);
  },
};

map.on("click",e=>{
  if(e.originalEvent && e.originalEvent._handled) return;

function findParcel(ppin,pn){ let hit=null; if(!parcelLayer) return null; parcelLayer.eachLayer(l=>{ if(hit) return; const p=P(l.feature); if((ppin&&p.ppin===String(ppin))||(pn&&p.parcel===String(pn))) hit=l.feature; }); return hit; }
const COLUMNS=["id","kind","name","address","ppin","parcel_number","owner","acreage","current_zone","requested_zone","status","application_no","submitted_date","pc_date","pc_vote","council_date","council_vote","decision_date","ordinance_no","notes","public","lat","lng","geometry","source","updated_at","updated_by"];
function toCSV(rows){ const q=v=>{ v=v==null?"":String(v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }; return [COLUMNS.join(","),...rows.map(r=>COLUMNS.map(c=>q(r[c])).join(","))].join("\r\n"); }

/* rows without geometry: place on the matching parcel, or on lat/lng columns */
function hydrateRows(rows){ rows.forEach(r=>{ if(geomOf(r)) return; if(r.lat && r.lng && !isNaN(+r.lat)){ r.geometry=JSON.stringify({type:"Point",coordinates:[+r.lng,+r.lat]}); return; } const f=findParcel(r.ppin,r.parcel_number); if(f) r.geometry=JSON.stringify(f.geometry); }); }

    vis("bldg",o.buildings); vis("z-fill",State.layers.zoning); vis("z-line",State.layers.parcels); vis("limits",State.layers.limits);
    if(m.getLayer("z-fill")){ const onZ=Object.keys(ZONES).filter(z=>z!=="X" && State.zoneOn[z]!==false); m.setFilter("z-fill",["all",["!=",["get","_z"],"X"],["in",["get","_z"],["literal",onZ]]]); m.setPaintProperty("z-fill","fill-opacity",Math.min(.85,State.opacity+.1)); } ["a-fill","a-pt"].forEach(id=>vis(id,State.layers.annex));
    try{ m.setTerrain(o.terrain?{source:"dem",exaggeration:+o.exag}:null); }catch(e){}
    vis("hill",o.terrain);
    this.save();
  },
  select(){
    if(!this.map||!this.map.getLayer("z-sel")) return;
    const i = State.selected && State.selected.kind==="parcel" && parcelData ? parcelData.features.indexOf(State.selected.feature) : -1;
    this.map.setFilter("z-sel",["==",["get","_i"],i]);
  },
  click(e){
    const m=this.map; const layers=["a-fill","a-pt","z-fill"].filter(l=>m.getLayer(l));
    const f=m.queryRenderedFeatures(e.point,{layers})[0];
    if(!f){ clearSelection(); this.select(); return; }
    if(f.layer.id!=="z-fill") selectProp(f.properties.id,false); else selectParcel(parcelData.features[f.properties._i],false);
    this.select();
  },
  pad(){ return isMobile()? {top:40,bottom:Math.round(sheetHeight()||96)+20,left:20,right:20} : {top:60,bottom:120,left:(panelPad()[0]||40),right:70}; },
  flyToGeom(g,zoom){
    if(!this.map||!g) return; this.stopOrbit();
    const b=L.geoJSON(g).getBounds(), c=b.getCenter();
    this.map.flyTo({center:[c.lng,c.lat],zoom:zoom||Math.min(17.2,Math.max(15.5,this.map.cameraForBounds([[b.getWest(),b.getSouth()],[b.getEast(),b.getNorth()]],{padding:this.pad()})?.zoom||16.5)),pitch:62,bearing:this.map.getBearing(),padding:this.pad(),duration:2600,essential:true});
    this.select();
  },
  orbit(){ if(this.orbiting){ this.stopOrbit(); return; } this.stopTour(); this.orbiting=true; const step=()=>{ if(!this.orbiting||!this.map) return; this.map.setBearing((this.map.getBearing()+0.12)%360); this.raf=requestAnimationFrame(step); }; step(); this.renderCtl(); },
  stopOrbit(){ if(!this.orbiting) return; this.orbiting=false; cancelAnimationFrame(this.raf); this.renderCtl(); },
  async tour(){
    if(this.touring){ this.stopTour(); return; }
    this.stopOrbit(); this.touring=true; const m=this.map;
    const stops=[];
    const lb=limitsLayer && limitsLayer.getBounds(); if(lb && lb.isValid()){ const c=lb.getCenter(); stops.push({label:"City of Arab",center:[c.lng,c.lat],zoom:13.6,pitch:50,bearing:0}); }
    stops.push({label:"Downtown · Main Street",center:[CONFIG.CENTER[1],CONFIG.CENTER[0]],zoom:16.6,pitch:72,bearing:-35});
    visibleRows().filter(isOpen).slice(0,6).forEach((r,i)=>{ const g=geomOf(r); if(!g) return; const c=L.geoJSON(g).getBounds().getCenter(); stops.push({label:(r.name||r.address)+" · "+statusOf(r.status).label,center:[c.lng,c.lat],zoom:16.2,pitch:66,bearing:30+i*55,id:r.id}); });
    if(stops[0]) stops.push(Object.assign({},stops[0],{label:"City of Arab",bearing:40}));
    const wait=ms=>new Promise(r=>setTimeout(r,ms));
    for(const s of stops){
      if(!this.touring||!this.map) break;
      this.stopLabel=s.label; this.renderCtl();
      m.flyTo({center:s.center,zoom:s.zoom,pitch:s.pitch,bearing:s.bearing,padding:this.pad(),duration:6000,curve:1.3,essential:true});
      await new Promise(r=>m.once("moveend",r));
      if(!this.touring) break;
      if(s.id){ selectProp(s.id,false); }
      m.easeTo({bearing:s.bearing+25,duration:3200,easing:t=>t}); await wait(3400);
    }
    this.touring=false; this.stopLabel=""; this.renderCtl();
  },
  stopTour(){ if(!this.touring) return; this.touring=false; if(this.map) this.map.stop(); this.stopLabel=""; this.renderCtl(); },
  renderCtl(){
    const el=$("#ctl3d"); if(!this.on){ el.hidden=true; return; }
    const o=this.opts, chip=(k,l)=>'<button class="chip" data-o="'+k+'" aria-pressed="'+!!o[k]+'">'+l+'</button>';
    el.innerHTML='<div class="c3-row"><div class="seg"><button data-base="sat" aria-pressed="'+(o.base==="sat")+'">Satellite</button><button data-base="light" aria-pressed="'+(o.base==="light")+'">Light</button></div>'+
      chip("buildings","3D buildings")+chip("terrain","Hills")+'<button class="chip" data-zon aria-pressed="'+!!State.layers.zoning+'">Zoning</button>'+'</div>'+
      '<div class="c3-row"><button class="btn sm primary" id="c3Tour">'+(this.touring?"Stop tour":"▶ Fly-over tour")+'</button><button class="btn sm" id="c3Orbit" aria-pressed="'+this.orbiting+'">'+(this.orbiting?"Stop rotating":"Rotate")+'</button>'+
      '<label class="c3-ex">Hills ×<b>'+(+o.exag).toFixed(1)+'</b><input type="range" id="c3Ex" min="1" max="4" step="0.1" value="'+o.exag+'"'+(o.terrain?'':' disabled')+' aria-label="Hill exaggeration"></label><button class="btn sm ghost" id="c3Exit">Exit 3D</button></div>'+
      (this.stopLabel?'<div class="c3-now">'+esc(this.stopLabel)+'</div>':'')+
      '<div class="c3-attr">Designed &amp; built by Collins Alexander (Pending Business License) · MapLibre · Imagery © Esri, Maxar · © OpenStreetMap, OpenFreeMap · Terrain: AWS Terrain Tiles</div>';
    el.hidden=false;
    $$("[data-base]",el).forEach(b=>b.onclick=()=>{ o.base=b.dataset.base; this.apply(); this.renderCtl(); });
    $$("[data-o]",el).forEach(b=>b.onclick=()=>{ o[b.dataset.o]=!o[b.dataset.o]; this.apply(); this.renderCtl(); });
    $("[data-zon]",el).onclick=()=>{ setLayer("zoning",!State.layers.zoning); this.renderCtl(); if(State.tab==="layers") renderPanel(); };
    $("#c3Tour",el).onclick=()=>this.tour();
    $("#c3Orbit",el).onclick=()=>this.orbit();
    $("#c3Exit",el).onclick=()=>this.exit();
    const ex=$("#c3Ex",el); ex.oninput=()=>{ o.exag=+ex.value; ex.previousElementSibling.textContent=o.exag.toFixed(1); try{ this.map.setTerrain(o.terrain?{source:"dem",exaggeration:o.exag}:null); }catch(e){} }; ex.onchange=()=>this.save();
  },
};
$("#t3d").onclick=()=>View3D.toggle();

/* =====================================================================
   BOOT
   ===================================================================== */
Store.on(rows=>{ hydrateRows(rows); renderPropLayer(); View3D.refresh(); buildIndex(); if(!Admin.form) renderPanel(); if(!$("#admin").hidden) Admin.render(); applyHash(); });
let hashApplied=false;
function applyHash(){
  if(hashApplied) return; const h=decodeURIComponent(location.hash.slice(1)); if(!h) { hashApplied=true; return; }
  if(h==="staff"){ hashApplied=true; Admin.open(); return; }
  if(h.startsWith("a-")){ if(Store.mode==="loading") return; hashApplied=true; selectProp(h.slice(2),true); return; }
  if(h.startsWith("p-")){ hashApplied=true; const k=h.slice(2); const f=findParcel(k,k); if(f) selectParcel(f,true); }
}
(async function boot(){
  await Auth.restore(); updateStaffBtn(); if(isPhone() && Auth.enabled()) $("#adminBtn").hidden=true;
  setBasemap(State.basemap);
  if(State.layers.flood) floodLayer.addTo(map);
  setTimeout(()=>{ if(State.tilesOk===null && tileOk===0){ State.tilesOk=false; onTilesDecided(); } },6000);
  for(let i=0;i<80 && $("#map").clientWidth<50;i++) await new Promise(r=>setTimeout(r,100));
  map.invalidateSize();
  if(isMobile()){ setSheet("peek"); qEl.placeholder="Address, owner or PPIN"; }
  await loadMapData();
  if(!location.hash && $("#map").clientWidth>=50){ const c=CONFIG.CENTER; map.fitBounds(L.latLngBounds([c[0]-0.011,c[1]-0.014],[c[0]+0.011,c[1]+0.014]),Object.assign({maxZoom:16},fitPad())); }
  renderPanel(); applyHash();
  await Store.init();
  renderPanel();
})();
</script>
